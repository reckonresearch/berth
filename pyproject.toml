[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berth-placement"
version = "0.8.0"
description = "Adaptive placement infrastructure for AI inference: predict what a workload costs on a given accelerator before you rent it."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["inference", "llm", "gpu", "placement", "performance-modeling",
            "vllm", "sglang", "benchmarking", "mlops", "cost-optimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Benchmark",
]
license = "Apache-2.0"
authors = [{ name = "Reckon Research" }]
dependencies = []  # stdlib only, by design: auditability of the core model

[project.urls]
Homepage = "https://www.reckonresearch.com/berth"
Documentation = "https://docs.reckonresearch.com"
Repository = "https://github.com/ReckonResearch/berth"
Changelog = "https://github.com/ReckonResearch/berth/blob/main/CHANGELOG.md"

[project.scripts]
berth = "berth.cli:main"
sounding = "berth.sounding_cli:main"
pilot = "berth.pilot_cli:main"
berth-api = "berth.api:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["berth*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["tutorials", "data", ".berth"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]  # lambdas as named objectives are the API's idiom

[tool.ruff.lint.per-file-ignores]
"berth/silicon.py" = ["E501"]   # aligned fleet table: alignment > line length
"berth/workload.py" = ["E501"]  # aligned model table
"demo*.py" = ["E501"]         # demo print-format lines: table alignment > line length
