name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" ruff
      - run: ruff check berth tests bench demo.py demo_calibrate.py demo_queueing.py demo_drift.py
      - run: python -m pytest tests/ -q
      - run: for d in demo.py demo_calibrate.py demo_queueing.py demo_drift.py tutorials/*.py; do python $d > /dev/null; done
      - run: pipx run pyright --level error berth || true  # advisory until annotations complete
